# Runs Linkwell's checks on GitHub's computers for every push to main and every
# pull request (including Dependabot's package updates). A green tick means
# types, lint, unit tests and browser tests all passed.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, unfinished run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The test database only (a Neon branch), never the real one. Set it in
      # GitHub: Settings → Secrets and variables → Actions (and → Dependabot,
      # so package updates are tested too).
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      BETTER_AUTH_URL: http://localhost:3100
      # Tests sign in without Google, so these only need to exist.
      GOOGLE_CLIENT_ID: not-used-in-tests
      GOOGLE_CLIENT_SECRET: not-used-in-tests
      CRON_SECRET: not-used-in-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A fresh, random sign-in secret for this run: nothing to store or leak.
      - run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # When a browser test fails, keep the report (with traces) for a week.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
