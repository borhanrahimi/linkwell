# Dependabot opens pull requests to update Linkwell's packages, once a week.
# The Checks workflow tests each one; merge it when the tick is green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Small updates come together in one pull request, so there are fewer to
    # review; big (major) updates come one by one, since they can need changes.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Node's type definitions follow the Node version Linkwell runs on (22, see
    # ci.yml); a newer major would let code use features the server lacks.
    # Raise it together with the Node version, by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Waiting on Next.js's lint setup (eslint-config-next), checked 2026-10-21:
      # typescript-eslint refuses TypeScript 7 ("does not support TS 7.0"), and
      # its import, jsx-a11y and react plugins don't support ESLint 10 yet. Our
      # own code passes both. Remove these two when eslint-config-next supports
      # them (see MAINTENANCE.md, "Big upgrades").
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  # The workflow's own building blocks (actions/checkout and friends).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
